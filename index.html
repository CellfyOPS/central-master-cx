<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central Master CX · Cellfy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#EFEFF5; --surface:#FFFFFF; --surface-2:#F6F6FA; --ink:#121025; --muted:#5C5A72; --line:#D9D8E4;
  --accent:#5D1497; --accent-ink:#FFFFFF; --brand-a:#5D1497; --brand-b:#3EC9E8; --rail:#121025;
  --ok:#1D7F55; --warn:#B7791F; --crit:#C2343B; --neutral:#7C8794;
  --ok-soft:#E3F2EA; --warn-soft:#F8EED9; --crit-soft:#F9E3E4;
  --body:'Barlow', 'Segoe UI', Arial, sans-serif;
  --display:'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14132B; --surface:#1C1B37; --surface-2:#232242; --ink:#ECEBF5; --muted:#A3A1BC; --line:#302E52;
    --accent:#4EE6EE; --accent-ink:#121025; --rail:#0D0C1F;
    --ok:#4CC08A; --warn:#E3B04B; --crit:#F0707A; --neutral:#93A1AF;
    --ok-soft:#173327; --warn-soft:#3A2F17; --crit-soft:#3D1D22;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--body);font-size:15px;line-height:1.45;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Estrutura */
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.rail{background:var(--rail);color:#E6ECF2;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{display:block;width:132px;height:auto;margin:0 8px 14px}
.brand{font-family:var(--display);font-weight:600;font-size:20px;line-height:1;margin:0 8px 3px;color:#fff}
.brand:empty{display:none}
.brand-sub{font-size:12px;color:#A3A1BC;margin:0 8px 22px}
.nav{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:#B9C4CF;font-weight:500}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}
.nav{position:relative}
.nav[aria-current="page"]{background:rgba(255,255,255,.07);color:#fff}
.nav[aria-current="page"]::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:linear-gradient(180deg,#7B2FD0,#4EE6EE)}
.nav:focus-visible{outline:2px solid #4EE6EE}
.rail-foot{margin-top:auto;font-size:12px;color:#93A1AF;padding:0 8px}
.rail-foot a{color:#B9C4CF}
main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:22px}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:0}
h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0 0 10px}
h3{font-size:15px;margin:0}
.sub{color:var(--muted);margin:6px 0 0}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;align-items:center;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));overflow-x:auto;gap:2px}
  .logo{width:84px;margin:0 12px 0 4px;flex:none}
  .brand,.brand-sub,.rail-foot{display:none}
  .nav{padding:8px 10px;white-space:nowrap}
  .nav[aria-current="page"]::before{left:8px;right:8px;top:auto;bottom:0;width:auto;height:3px;background:linear-gradient(90deg,#7B2FD0,#4EE6EE)}
}

/* Elementos */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.grid{display:grid;gap:16px}
.cols-blocos{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
@media (max-width:420px){.cols-blocos{grid-template-columns:1fr}}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:6px 8px}
.btn:disabled{opacity:.55;cursor:wait}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input[type=date],input[type=text],input[type=email],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:80px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--display);font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--neutral);flex:none}
.s-ok{--s:var(--ok)} .s-atencao{--s:var(--warn)} .s-critico{--s:var(--crit)} .s-neutro,.s-sem{--s:var(--neutral)}
.dot{background:var(--s,var(--neutral))}
.bom,.when.bom{color:var(--ok)} .ruim,.when.ruim{color:var(--crit)}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:8px;font-weight:500;z-index:50;max-width:90vw}
.toast.erro{background:var(--crit);color:#fff;white-space:pre-line}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);padding:30px 0}
.loading::before{content:"";width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.loading::before{animation:none}}

/* Painel: torre de cronometragem */
.score{display:flex;gap:26px;align-items:baseline}
.score b{font-family:var(--display);font-size:40px;line-height:1;font-weight:700;display:block}
.score span{font-size:13px;color:var(--muted)}
.tower{display:flex;flex-direction:column}
.bloco-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.bloco-head button{all:unset;cursor:pointer;font-family:var(--display);font-weight:600;font-size:22px}
.bloco-head button:hover{color:var(--accent)}
.conta{font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 2px}
.lap{display:grid;grid-template-columns:4px 1fr 70px 84px 64px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.lap:last-child{border-bottom:0}
.lap .bar{align-self:stretch;border-radius:2px;background:var(--s,var(--neutral))}
.lap .nm{font-size:14px;line-height:1.25;min-width:0}
.lap .nm small{display:block;color:var(--muted);font-size:12px}
.lap .val{text-align:right;font-family:var(--display);font-weight:600;font-size:19px}
.lap .dl{text-align:right;font-size:12px;font-weight:600}
.lap svg{width:70px;height:22px;display:block}
@media (max-width:420px){.lap{grid-template-columns:4px 1fr 78px 58px}.lap svg{display:none}}
.lap.atrasado .nm small::after{content:" · sem lançamento recente";color:var(--warn)}
.pend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.pend .item{display:flex;align-items:center;gap:10px;background:var(--warn-soft);border-left:4px solid var(--warn);padding:8px 12px;border-radius:6px;font-size:14px}
.rank{display:grid;grid-template-columns:28px 110px 1fr 64px 80px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .pos{font-family:var(--display);font-weight:700;font-size:20px}
.rank .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.rank .fill{height:100%;background:linear-gradient(90deg,#7B2FD0,#3EC9E8);border-radius:5px}
.rank .fill.inel{background:var(--neutral)}
.obs-list{margin:0;padding:0;list-style:none}
.obs-list li{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.obs-list li:last-child{border-bottom:0}

/* Lançar */
.form-ind{display:grid;grid-template-columns:minmax(0,1fr) 150px 120px;gap:8px 14px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.form-ind:last-child{border-bottom:0}
.form-ind .inp{display:flex;align-items:center;gap:6px}
.form-ind .inp input,.form-ind .inp select{width:100%;text-align:right;font-family:var(--display);font-weight:600;font-size:18px;padding:6px 10px}
.form-ind .inp select{text-align:left;font-family:var(--body);font-size:15px;font-weight:500}
.form-ind .unit{color:var(--muted);font-size:13px;width:18px}
.form-ind .prev{font-size:12px;color:var(--muted);text-align:right}
.form-ind.mudou .inp input,.form-ind.mudou .inp select{border-color:var(--accent)}
@media (max-width:640px){.form-ind{grid-template-columns:1fr 130px}.form-ind .prev{grid-column:1/-1;text-align:left;margin-top:-4px}}
.savebar{position:sticky;bottom:0;background:var(--bg);padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:flex-end;border-top:1px solid var(--line);margin-top:18px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);max-width:560px;width:calc(100% - 32px);padding:22px}
dialog::backdrop{background:rgba(10,16,22,.5)}
dialog ul{padding-left:18px}

/* Relatório */
.filters{display:grid;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.rep-head{border-left:6px solid var(--accent);padding:2px 0 2px 16px;margin:26px 0 18px}
.rep-head h2{font-size:30px;margin:0}
.dest{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:16px 0 8px}
.dest h3{font-family:var(--display);font-size:18px;font-weight:600;margin-bottom:6px}
.dest ul{margin:0;padding:0;list-style:none}
.dest li{font-size:14px;padding:5px 0;border-bottom:1px solid var(--line)}
.dest li:last-child{border-bottom:0}
.dest .critico h3{color:var(--crit)} .dest .melhor h3{color:var(--ok)}
.tbl-wrap{overflow-x:auto;margin-bottom:8px}
table.rep{border-collapse:collapse;width:100%;min-width:900px;font-size:13.5px}
table.rep th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:8px;border-bottom:2px solid var(--ink)}
table.rep td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.rep td.ind{min-width:200px}
table.rep tr.click{cursor:pointer}
table.rep tr.click:hover td{background:var(--surface-2)}
.depara{font-family:var(--display);font-weight:600;font-size:18px;white-space:nowrap}
.depara .seta{color:var(--muted);font-weight:500;padding:0 4px}
.delta{font-weight:700;white-space:nowrap}
.when{display:block;color:var(--muted);font-size:12px}
.daystrip{display:flex;height:8px;border-radius:4px;overflow:hidden;min-width:90px;background:var(--surface-2)}
.daystrip i{display:block;height:100%}
.chartrow td{background:var(--surface-2)}
.chartbox{position:relative;height:240px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* Cancelamentos */
.canc-grid{display:grid;grid-template-columns:minmax(320px,440px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.canc-grid{grid-template-columns:1fr}}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.fgrid > *,.canc-grid > *{min-width:0}
.nav[hidden],[hidden]{display:none!important}
@media (max-width:420px){.fgrid{grid-template-columns:1fr}}
.fgrid input,.fgrid select,.fgrid textarea{width:100%}
.fgrid textarea{min-height:64px}
.hint{font-size:12px;color:var(--muted);margin-top:-2px}
.aviso{background:var(--warn-soft);border-left:4px solid var(--warn);padding:10px 12px;border-radius:6px;font-size:14px;margin-bottom:12px}
.aviso.crit{background:var(--crit-soft);border-left-color:var(--crit)}
.editando{background:var(--surface-2);border-left:4px solid var(--accent);padding:8px 12px;border-radius:6px;font-size:14px;margin-bottom:12px}
table.lista{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
table.lista td.trunc{max-width:220px}
table.lista td.trunc .when{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.lista th{font-size:12px;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:2px solid var(--ink);font-weight:600}
table.lista td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.lista tr.click{cursor:pointer}
table.lista tr.click:hover td{background:var(--surface-2)}
table.lista tr.sel td{background:var(--surface-2)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.tag.rup{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.tag.tro{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.tag.rep{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.money{font-family:var(--display);font-weight:600;white-space:nowrap}
.kpis{display:flex;flex-wrap:wrap;gap:12px 30px;align-items:flex-end}
.kpis b{font-family:var(--display);font-size:30px;line-height:1;font-weight:700;display:block}
.kpis span{font-size:13px;color:var(--muted)}
.kpis .vs{display:block;font-size:12px;font-weight:600}
.kpis .vs.bom{color:var(--ok)} .kpis .vs.ruim{color:var(--crit)}
table.lista td > b:first-child{white-space:nowrap}
/* Análises */
.an-grid{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.an-grid > .panel{min-width:0}
.c12{grid-column:span 12} .c8{grid-column:span 8} .c7{grid-column:span 7} .c6{grid-column:span 6} .c5{grid-column:span 5} .c4{grid-column:span 4}
@media (max-width:1100px){.c8,.c7,.c6,.c5,.c4{grid-column:span 12}}
.chart{position:relative;height:280px}
.chart.alto{height:340px}
.chart.baixo{height:220px}
.an-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:10px}
.an-head h2{margin:0}
.an-head select{max-width:100%}
.heat{display:grid;gap:2px;align-items:center;font-size:12px;overflow-x:auto}
.heat .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px;color:var(--ink)}
.heat .lbl small{color:var(--muted)}
.heat i{display:block;height:18px;border-radius:2px;background:var(--surface-2)}
.heat i.s-ok{background:var(--ok)} .heat i.s-atencao{background:var(--warn)} .heat i.s-critico{background:var(--crit)} .heat i.s-neutro{background:var(--neutral);opacity:.45}
.heat .dia{font-size:10px;color:var(--muted);text-align:center;white-space:nowrap}
.legenda{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:2px}
/* Clicáveis */
.score .sc{all:unset;cursor:pointer;border-radius:8px;padding:4px 8px;margin:-4px -8px}
.score .sc:hover{background:var(--surface-2)}
.score .sc[aria-pressed="true"]{background:var(--surface-2);outline:2px solid var(--line)}
.score .sc:focus-visible{outline:2px solid var(--accent)}
.lap.click{cursor:pointer}
.lap.click:hover{background:var(--surface-2)}
.filtro-ativo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px;font-size:14px}
.kpis .kk{cursor:pointer;border-radius:8px;padding:4px 8px;margin:-4px -8px}
.kpis .kk:hover{background:var(--surface-2)}
.kpis .kk[aria-pressed="true"]{outline:2px solid var(--line);background:var(--surface-2)}
.lnk{all:unset;cursor:pointer;color:var(--accent);font-weight:600}
.lnk:hover{text-decoration:underline}
dialog.wide{max-width:820px}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{all:unset;cursor:pointer;font-size:22px;line-height:1;color:var(--muted);padding:2px 6px}
/* Lançar: alternância e campos calculados */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:7px 12px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.form-ind input.calc,.grade input.calc{background:var(--surface-2);color:var(--muted);cursor:not-allowed}
.calc-tag{font-size:11px;font-weight:600;color:var(--accent);margin-left:6px}
/* Grade horizontal */
.grade-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
table.grade{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
table.grade th,table.grade td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0}
table.grade thead th{position:sticky;top:0;z-index:2;background:var(--surface);font-weight:600;padding:6px 8px;text-align:center;vertical-align:bottom}
table.grade thead tr:nth-child(2) th{top:31px;font-size:12px;min-width:96px;max-width:140px;white-space:normal;line-height:1.2}
table.grade thead th.g{color:#fff;font-family:var(--display);font-size:14px;letter-spacing:.2px}
table.grade th.dia,table.grade td.dia{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding:4px 10px;white-space:nowrap;font-weight:600}
table.grade thead th.dia{z-index:3}
table.grade td.dia small{display:block;color:var(--muted);font-weight:400;font-size:11px}
table.grade tr.fds td.dia{color:var(--muted)}
table.grade tr.fds td{background:var(--surface-2)}
table.grade td input,table.grade td select{all:unset;box-sizing:border-box;width:100%;min-width:90px;padding:7px 8px;text-align:right;font-family:var(--display);font-weight:600;font-size:15px;border-left:3px solid transparent}
table.grade td select{text-align:left;font-family:var(--body);font-size:13px;font-weight:500}
table.grade td input:focus,table.grade td select:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--surface)}
table.grade td.s-ok input,table.grade td.s-ok select{border-left-color:var(--ok)}
table.grade td.s-atencao input,table.grade td.s-atencao select{border-left-color:var(--warn);background:var(--warn-soft)}
table.grade td.s-critico input,table.grade td.s-critico select{border-left-color:var(--crit);background:var(--crit-soft)}
table.grade td.mudou input,table.grade td.mudou select{box-shadow:inset 0 0 0 2px var(--accent)}
table.grade td.inval input{box-shadow:inset 0 0 0 2px var(--crit);color:var(--crit)}
.meta-mini{display:block;font-weight:400;color:var(--muted);font-size:11px}
/* Configurações */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.cfg-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cfg-row:last-child{border-bottom:0}
@media (max-width:700px){.cfg-row{grid-template-columns:1fr}}
.cfg-row input{width:100%}
.flag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);margin:1px 2px 1px 0;white-space:nowrap}
.flag.on{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
tr.inativo td{opacity:.55}
.fgrid label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.vers{font-size:13px;margin:6px 0 0;padding-left:18px}
@media print{
  .rail,.filters-panel,.actions,.savebar{display:none!important}
  .app{display:block} main{padding:0} body{background:#fff}
  .panel{border:0;padding:0}
  table.rep{min-width:0}
}
</style>
</head>

<script>
/* ===== Conexão =====
   Dentro do Google (App da Web) usa google.script.run.
   No GitHub Pages, o endereço do sistema e o código pessoal são pedidos na tela de entrada
   e ficam guardados neste navegador. Não é preciso editar nada aqui. */
let API_URL = lsGet('pw_url') || '';

const S = { boot:null, view:'painel', dash:null, rep:null, charts:{} };

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

function call(action, payload){
  payload = payload || {};
  if (window.google && google.script && google.script.run) {
    return new Promise((res, rej) => google.script.run
      .withSuccessHandler(t => { const r = JSON.parse(t); r.ok ? res(r) : rej(new Error(r.erro)); })
      .withFailureHandler(e => rej(e))
      .api(action, JSON.stringify(payload)));
  }
  if (!API_URL) return Promise.reject(new Error('Informe o endereço do sistema.'));
  return fetch(API_URL, { method:'POST', body: JSON.stringify({ action, payload, token: lsGet('pw_token') }) })
    .then(r => r.json(), () => { throw new Error('Não foi possível falar com o sistema. Confira o endereço e a sua internet.'); })
    .then(r => {
      if (!r.ok) {
        if (/^Sessão encerrada/.test(r.erro) && action !== 'login') { lsSet('pw_token', ''); const d = $('#dlg'); if (d.open) d.close(); loginExterno(r.erro); }
        throw new Error(r.erro);
      }
      return r;
    });
}

/* ===== Utilidades ===== */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vazio = v => v === '' || v === null || v === undefined;
function toast(msg, erro){
  const t = document.createElement('div'); t.className = 'toast' + (erro ? ' erro' : ''); t.textContent = msg;
  t.setAttribute('role', erro ? 'alert' : 'status'); document.body.appendChild(t);
  setTimeout(() => t.remove(), erro ? 7000 : 3200);
}
function fmtN(n, c){
  if (n === null || n === undefined || !isFinite(n)) return '—';
  return Number(n).toLocaleString('pt-BR', { minimumFractionDigits: isFinite(c) ? c : 2, maximumFractionDigits: isFinite(c) ? c : 2 });
}
/* Funções copiadas do Motor.gs (horas no formato do RA e fórmulas) */
/** "1d 1h", "25h", "1d", "7h", "1d 11h", "25" ou "25,5" -> horas. Vazio -> null. Inválido -> NaN. */
function m_parseHoras(txt) {
  if (txt === null || txt === undefined) return null;
  if (typeof txt === 'number') return isFinite(txt) ? txt : NaN;
  const t = String(txt).trim().toLowerCase().replace(/\s+/g, ' ');
  if (!t) return null;
  if (/^\d+([.,]\d+)?$/.test(t)) return Number(t.replace(',', '.'));
  const m = t.match(/^(?:(\d+(?:[.,]\d+)?)\s*d(?:ia|ias)?)?\s*(?:(\d+(?:[.,]\d+)?)\s*h(?:ora|oras)?)?\s*(?:(\d+)\s*min(?:uto|utos)?)?$/);
  if (!m || (!m[1] && !m[2] && !m[3])) return NaN;
  const n = x => x ? Number(String(x).replace(',', '.')) : 0;
  return Math.round((n(m[1]) * 24 + n(m[2]) + n(m[3]) / 60) * 100) / 100;
}

/** horas -> "1d 1h" (como o RA mostra). */
function m_fmtHoras(n) {
  if (n === null || n === undefined || !isFinite(n)) return '—';
  const h = Math.round(Math.abs(n)), d = Math.floor(h / 24), r = h % 24;
  return d ? (r ? d + 'd ' + r + 'h' : d + 'd') : r + 'h';
}

/* ---------------- Fórmulas entre indicadores do mesmo dia ---------------- */
/* Sintaxe: {RA-RESP-QTD} / {RA-RECL6M} * 100   (+ - * / parênteses e números) */

function m_formulaTokens(expr) {
  const out = [];
  const s = String(expr || '').trim().replace(/^=/, '');
  let i = 0;
  while (i < s.length) {
    const ch = s[i];
    if (/\s/.test(ch)) { i++; continue; }
    if (ch === '{') {
      const j = s.indexOf('}', i);
      if (j < 0) throw new Error('Fórmula: falta fechar a chave }');
      const id = s.slice(i + 1, j).trim();
      if (!id) throw new Error('Fórmula: indicador vazio entre chaves');
      out.push({ t: 'ref', v: id }); i = j + 1; continue;
    }
    const num = s.slice(i).match(/^\d+([.,]\d+)?/);
    if (num) { out.push({ t: 'num', v: Number(num[0].replace(',', '.')) }); i += num[0].length; continue; }
    if ('+-*/()'.indexOf(ch) >= 0) { out.push({ t: 'op', v: ch }); i++; continue; }
    throw new Error('Fórmula: caractere não reconhecido "' + ch + '"');
  }
  if (!out.length) throw new Error('Fórmula vazia');
  return out;
}

/** Avalia a fórmula. get(id) devolve o número do indicador ou null. Resultado null quando falta dado ou há divisão por zero. */
function m_formulaCalc(expr, get) {
  const tk = m_formulaTokens(expr);
  let p = 0, falta = false;
  const prox = () => tk[p];
  const expr_ = () => {
    let v = termo();
    while (prox() && (prox().v === '+' || prox().v === '-') && prox().t === 'op') { const o = tk[p++].v; const b = termo(); v = (v === null || b === null) ? null : (o === '+' ? v + b : v - b); }
    return v;
  };
  const termo = () => {
    let v = fator();
    while (prox() && prox().t === 'op' && (prox().v === '*' || prox().v === '/')) {
      const o = tk[p++].v; const b = fator();
      if (v === null || b === null) v = null;
      else if (o === '*') v = v * b;
      else v = b === 0 ? null : v / b;
    }
    return v;
  };
  const fator = () => {
    const t = tk[p++];
    if (!t) throw new Error('Fórmula incompleta');
    if (t.t === 'num') return t.v;
    if (t.t === 'ref') { const n = get(t.v); if (n === null || n === undefined || !isFinite(Number(n)) || n === '') { falta = true; return null; } return Number(n); }
    if (t.v === '-') { const v = fator(); return v === null ? null : -v; }
    if (t.v === '(') { const v = expr_(); const f = tk[p++]; if (!f || f.v !== ')') throw new Error('Fórmula: falta fechar o parêntese'); return v; }
    throw new Error('Fórmula: "' + t.v + '" fora do lugar');
  };
  const v = expr_();
  if (p < tk.length) throw new Error('Fórmula: sobrou "' + tk[p].v + '" no fim');
  if (falta || v === null || !isFinite(v)) return null;
  return Math.round(v * 10000) / 10000;
}

/** Lista os indicadores usados numa fórmula (e valida a sintaxe). */
function m_formulaRefs(expr) {
  m_formulaCalc(expr, () => 1);
  return m_formulaTokens(expr).filter(t => t.t === 'ref').map(t => t.v);
}


function fmtV(ind, v){
  if (vazio(v)) return '—';
  if (ind.tipo === 'status') return String(v);
  const n = Number(v); if (!isFinite(n)) return String(v);
  if (ind.tipo === 'percentual') return fmtN(n, ind.casas) + '%';
  if (ind.tipo === 'moeda') return 'R$ ' + fmtN(n, 2);
  if (ind.tipo === 'horas') return m_fmtHoras(n);
  return fmtN(n, ind.casas);
}
function fmtD(ind, d){
  if (d === null || d === undefined) return '—';
  const s = d > 0 ? '+' : (d < 0 ? '−' : '±'), a = Math.abs(d);
  if (ind.tipo === 'percentual') return s + fmtN(a, ind.casas) + 'pp';
  if (ind.tipo === 'horas') return s + m_fmtHoras(a);
  if (ind.tipo === 'moeda') return s + 'R$ ' + fmtN(a, 2);
  return s + fmtN(a, ind.casas);
}
const dd = ymd => ymd ? ymd.slice(8,10) + '/' + ymd.slice(5,7) : '—';
const ddl = ymd => ymd ? ymd.slice(8,10) + '/' + ymd.slice(5,7) + '/' + ymd.slice(0,4) : '—';
function addDias(ymd, n){ const d = new Date(ymd + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); }
/** Meta vigente numa data (versões criadas na Central de configurações). */
function versao(ind, data){
  const vs = ind && ind.versoes;
  if (!data || !vs || !vs.length) return { meta: ind.meta, atencao: ind.atencao, critico: ind.critico };
  let v = vs[0];
  for (let i = 0; i < vs.length; i++){ if (vs[i].desde <= data) v = vs[i]; else break; }
  return v;
}
/** Linha de atenção/crítico para gráficos: acompanha a meta de cada dia. */
function linhaFaixa(ind, dias, campo){
  const ys = dias.map(d => { const x = versao(ind, d)[campo]; return vazio(x) || !isFinite(Number(x)) ? null : Number(x); });
  return ys.some(y => y !== null) ? ys : null;
}
function status(ind, v, data){
  if (vazio(v)) return 'sem';
  const fx = versao(ind, data), at = fx.atencao, cr = fx.critico;
  if (ind.tipo === 'status'){
    const ops = String(ind.opcoes||'').split('|').map(s => s.trim().toLowerCase());
    const i = ops.indexOf(String(v).trim().toLowerCase()); if (i < 0) return 'neutro';
    const ia = vazio(at) ? -1 : ops.indexOf(String(at).toLowerCase()), ic = vazio(cr) ? -1 : ops.indexOf(String(cr).toLowerCase());
    if (ia < 0 && ic < 0) return 'neutro';
    if (ic >= 0 && i >= ic) return 'critico'; if (ia >= 0 && i >= ia) return 'atencao'; return 'ok';
  }
  const n = Number(v); if (!isFinite(n)) return 'neutro';
  const hA = !vazio(at) && isFinite(Number(at)), hC = !vazio(cr) && isFinite(Number(cr));
  if (!hA && !hC) return 'neutro';
  if (ind.melhor_quando === 'maior'){ if (hC && n < Number(cr)) return 'critico'; if (hA && n < Number(at)) return 'atencao'; return 'ok'; }
  if (hC && n > Number(cr)) return 'critico'; if (hA && n > Number(at)) return 'atencao'; return 'ok';
}
function sentido(ind, d){
  if (d === null || d === undefined || d === 0 || ind.melhor_quando === 'neutro') return '';
  return (ind.melhor_quando === 'maior') === (d > 0) ? 'bom' : 'ruim';
}
function parseEntrada(ind, raw){
  if (vazio(raw) || String(raw).trim() === '') return null;
  if (ind.tipo === 'status') return String(raw);
  if (ind.tipo === 'horas') return m_parseHoras(raw);
  let s = String(raw).trim().replace(/R\$\s?/,'').replace(/%/g,'').replace(/\s/g,'');
  if (s.indexOf(',') >= 0) s = s.replace(/\./g,'').replace(',', '.');
  else if ((ind.tipo === 'numero' || ind.tipo === 'moeda') && /^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  const n = Number(s); return isFinite(n) ? n : NaN;
}
const ROT = { ok:'Na meta', atencao:'Atenção', critico:'Crítico', neutro:'Sem meta', sem:'Sem dados' };
function spark(vals, st){
  const v = (vals || []).map((x, i) => [i, x]).filter(p => p[1] !== null && isFinite(p[1]));
  if (v.length < 2) return '<svg viewBox="0 0 70 22" aria-hidden="true"></svg>';
  const xs = vals.length - 1, ys = v.map(p => p[1]), mn = Math.min.apply(null, ys), mx = Math.max.apply(null, ys), r = (mx - mn) || 1;
  const pts = v.map(p => (p[0] / xs * 68 + 1).toFixed(1) + ',' + (20 - (p[1] - mn) / r * 18).toFixed(1)).join(' ');
  return '<svg viewBox="0 0 70 22" aria-hidden="true" class="s-' + st + '"><polyline points="' + pts + '" fill="none" stroke="var(--s,var(--neutral))" stroke-width="1.6" stroke-linejoin="round"/></svg>';
}
function indById(id){ return S.boot.catalogo.find(c => c.id === id); }
function fmtEntrada(ind, v){ if (vazio(v)) return ''; if (ind.tipo === 'status') return v; if (ind.tipo === 'horas' && isFinite(Number(v))) return m_fmtHoras(Number(v)); return String(v).replace('.', ','); }
/** Rótulo do subgrupo: grupo do Catálogo ou, sem grupo, a conta. */
function rotGrupo(i){ return i.grupo ? (i.conta && i.conta !== 'Geral' ? i.conta + ' · ' : '') + i.grupo : i.conta; }

/** Lista as mudanças grandes e as remoções para a confirmação antes de salvar. */
function revisarMudancas(lista){
  const alertaVar = S.boot.cfg.alerta_variacao || 0.5, grandes = [], removidos = [];
  lista.forEach(x => {
    const ind = x.ind, n = x.novo, rot = ind.indicador + (ind.conta && ind.conta !== 'Geral' ? ' (' + ind.conta + ')' : '') + (x.data ? ' · ' + dd(x.data) : '');
    if (n === null && !vazio(x.antigo)) removidos.push(rot + ': ' + fmtV(ind, x.antigo));
    if (n !== null && typeof n === 'number' && x.anterior !== undefined && x.anterior !== null && isFinite(Number(x.anterior))){
      const base = Math.abs(Number(x.anterior)), dif = Math.abs(n - Number(x.anterior));
      if (dif > 0 && (base ? dif / base > alertaVar : dif >= 1)) grandes.push(rot + ': ' + fmtV(ind, x.anterior) + ' → ' + fmtV(ind, n));
    }
  });
  if (!grandes.length && !removidos.length) return '';
  return (grandes.length ? '<p>Estes valores mudaram mais de ' + Math.round(alertaVar * 100) + '% em relação ao lançamento anterior:</p><ul>' + grandes.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '') +
    (removidos.length ? '<p>Estes valores serão removidos:</p><ul>' + removidos.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '');
}
function salvarDia(){
  const r = S.day;
  const valores = {}, invalidos = [], lista = [];
  $$('[data-id]', $('#lForm')).forEach(el => {
    const ind = indById(el.dataset.id);
    if (ind.formula) return;
    const n = parseEntrada(ind, el.value);
    if (Number.isNaN(n)) { invalidos.push(ind.indicador + ' (' + ind.conta + ')'); return; }
    valores[ind.id] = ind.tipo === 'horas' && n !== null ? n : (n === null ? null : n);

    lista.push({ ind: ind, novo: n, antigo: r.valores[ind.id], anterior: a ? a.v : null });
  });
  if (invalidos.length) return toast('Valor inválido em: ' + invalidos.join(', '), true);
  const enviar = () => {
    const b = $('#lSalvar'); b.disabled = true; b.textContent = 'Salvando';
    call('saveDay', { data: r.data, bloco: r.bloco, valores, obs: $('#lObs').value }).then(res => {

    }).catch(e => { toast(e.message, true); b.disabled = false; b.textContent = 'Salvar lançamento'; });

function toggleChart(tr, s){
  const next = tr.nextElementSibling;
  if (next && next.classList.contains('chartrow')){ if (S.charts[s.id]) { S.charts[s.id].destroy(); delete S.charts[s.id]; } next.remove(); return; }
  if (s.tipo === 'status' || !window.Chart) return;
  const row = document.createElement('tr'); row.className = 'chartrow';
  row.innerHTML = '<td colspan="9"><div class="chartbox"><canvas aria-label="Evolução de ' + esc(s.indicador) + '"></canvas></div></td>';
  tr.after(row);
  const css = getComputedStyle(document.documentElement), cor = k => css.getPropertyValue(k).trim();
  const labels = s.serie.map(p => dd(p.data)), datas = s.serie.map(p => p.data);
  const ds = [{ label: s.indicador, data: s.serie.map(p => isFinite(Number(p.v)) ? Number(p.v) : null), borderColor: cor('--accent'), backgroundColor: cor('--accent'), tension: .25, pointRadius: 2.5, borderWidth: 2 }];
  const la = linhaFaixa(s, datas, 'atencao'), lc = linhaFaixa(s, datas, 'critico');
  if (la) ds.push({ label: 'Atenção', data: la, borderColor: cor('--warn'), borderDash: [5, 4], pointRadius: 0, borderWidth: 1.5, stepped: true });
  if (lc) ds.push({ label: 'Crítico', data: lc, borderColor: cor('--crit'), borderDash: [5, 4], pointRadius: 0, borderWidth: 1.5, stepped: true });
  S.charts[s.id] = new Chart(row.querySelector('canvas'), { type: 'line', data: { labels, datasets: ds },
    options: { responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { labels: { color: cor('--muted'), boxWidth: 14 } }, tooltip: { callbacks: { label: c => c.dataset.label + ': ' + fmtV(s, c.parsed.y) } } },
      scales: { x: { ticks: { color: cor('--muted'), maxRotation: 0, autoSkip: true }, grid: { display: false } },
                y: { ticks: { color: cor('--muted'), callback: v => fmtV(s, v) }, grid: { color: cor('--line') } } } } });
}

function money(n){ return 'R$ ' + fmtN(n || 0, 2); }
function baixarCSV(p){

    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([r.csv], { type: 'text/csv;charset=utf-8' })); a.download = r.nome;

}
function kpisCancel(A, P, rotAnt, clicavel, ativo){

    if (!P || b === null || b === undefined) return '';

    return '<span class="vs ' + (bom ? 'bom' : 'ruim') + '">' + (d > 0 ? '+' : '−') + f(Math.abs(d)) + '</span>';
  };
  const k = (so, tit) => clicavel ? ' class="kk" role="button" tabindex="0" data-kpi="' + so + '" aria-pressed="' + ((ativo || '') === so) + '" title="' + tit + '"' : '';
  return '<div class="kpis">' +
    '<div' + k('', 'Ver todos os casos') + '><b>' + A.casos + '</b><span>pedidos afetados</span>' + vs(A.casos, P && P.casos, true, n => fmtN(n, 0)) + '</div>' +
    '<div' + k('perdido', 'Ver só os casos com perda') + '><b style="color:var(--crit)">' + money(A.perdido) + '</b><span>perdido</span>' + vs(A.perdido, P && P.perdido, true, money) + '</div>' +
    '<div' + k('recuperado', 'Ver só os casos recuperados') + '><b style="color:var(--ok)">' + money(A.recuperado) + '</b><span>recuperado</span>' + vs(A.recuperado, P && P.recuperado, false, money) + '</div>' +
    '<div' + k('erro', 'Ver só os erros internos (C2)') + '><b>' + (A.erroInterno || 0) + '</b><span>erros internos</span>' + vs(A.erroInterno || 0, P && P.erroInterno, true, n => fmtN(n, 0)) + '</div>' +
    '<div><b>' + (A.taxaRecuperacao === null ? '—' : fmtN(A.taxaRecuperacao, 1) + '%') + '</b><span>taxa de recuperação</span>' + vs(A.taxaRecuperacao || 0, P && P.taxaRecuperacao, false, n => fmtN(n, 1) + 'pp') + '</div>' +
    '</div>' + (P && rotAnt ? '<p class="small muted" style="margin:8px 0 0">Variações contra o ' + esc(rotAnt) + '.</p>' : '');
}

          y2: { position: 'right', grid: { display: false }, ticks: { precision: 0 }, title: { display: true, text: 'pedidos' } } } } });
    const mot = C.atual.porMotivo;
    mkChart('chMotivo', { type: 'doughnut', data: { labels: mot.map(m => m.nome), datasets: [{ data: mot.map(m => m.casos), backgroundColor: mot.map((m, i) => m.grupo === 'ruptura' ? ['#C2343B', '#E0636B', '#F09AA0'][i % 3] : m.grupo === 'troca' ? cssv('--ok') : PAL[(i + 2) % PAL.length]), borderColor: cssv('--surface'), borderWidth: 2 }] },
      options: { responsive: true, maintainAspectRatio: false, animation: false, cutout: '58%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } },
        onHover: maoNoGrafico, onClick: (e, els) => { if (els.length) go('cancel', { de: R.periodo.de, ate: R.periodo.ate, motivo: mot[els[0].index].nome }); } } });
    const ct = C.atual.porConta;
    mkChart('chConta', { type: 'bar', data: { labels: ct.map(m => m.nome), datasets: [
      { label: 'Perdido', data: ct.map(m => m.perdido), backgroundColor: cssv('--crit') }, { label: 'Recuperado', data: ct.map(m => m.recuperado), backgroundColor: cssv('--ok') }] },
      options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } }, tooltip: { callbacks: { label: c => c.dataset.label + ': ' + money(c.parsed.y) } } },
        onHover: maoNoGrafico, onClick: (e, els) => { if (els.length) go('cancel', { de: R.periodo.de, ate: R.periodo.ate, conta: ct[els[0].index].nome }); },
        scales: { x: { grid: { display: false } }, y: { ticks: { callback: moneyTick } } } } });
    const tv = C.atual.topValor.slice(0, 8);
    mkChart('chSku', { type: 'bar', data: { labels: tv.map(m => m.nome), datasets: [{ label: 'Perdido', data: tv.map(m => m.perdido), backgroundColor: PAL[0] }] },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, animation: false,
        onHover: maoNoGrafico, onClick: (e, els) => { if (els.length) go('cancel', { de: R.periodo.de, ate: R.periodo.ate, sku: tv[els[0].index].nome }); },
        plugins: { legend: { display: false }, tooltip: { callbacks: { title: c => { const m = tv[c[0].dataIndex]; return m.nome + ' · ' + m.produto.slice(0, 50); }, label: c => money(c.parsed.x) + ' em ' + tv[c.dataIndex].casos + ' caso(s)' } } },
        scales: { x: { ticks: { callback: moneyTick } }, y: { grid: { display: false } } } } });
    if ($('#chC2')){
      const sw = C.semanas;
      mkChart('chC2', { type: 'line', data: { labels: sw.map(w => dd(w.semana)), datasets: [
        { label: 'C2', data: sw.map(w => w.pct), borderColor: PAL[0], backgroundColor: sw.map(w => w.dentro === false ? cssv('--crit') : cssv('--ok')), pointRadius: 5, tension: .2, spanGaps: true },
        { label: 'Meta', data: sw.map(w => w.meta), borderColor: cssv('--crit'), borderDash: [4, 4], pointRadius: 0, borderWidth: 1.5 }] },
        options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } }, tooltip: { callbacks: { label: c => c.dataset.label + ': ' + fmtN(c.parsed.y, 3) + '%' } } },

  if (E && E.operadoras.length){

    mkChart('chEqMes', { type: 'bar', data: { labels: M.map(m => nomeMes(m.mes)), datasets: nomes.map((n, i) => ({ label: n, data: M.map(m => { const o = m.ops.find(x => x.nome === n); return o ? Math.round(o.ajustado) : 0; }), backgroundColor: PAL[i % PAL.length] })) },

        scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, ticks: { precision: 0 } } } } });

    mkChart('chEqMix', { type: 'bar', data: { labels: ops.map(o => o.nome), datasets: can.map((c, i) => ({ label: c.nome, data: ops.map(o => o.atual.porCanal[c.id] || 0), backgroundColor: PAL[(i + 1) % PAL.length] })) },

    mkChart('chEqCsat', { type: 'bar', data: { labels: cs.map(o => o.nome), datasets: [
      { label: 'CSAT ' + (R.periodo ? 'no período' : ''), data: cs.map(o => o.atual.csat.pct), backgroundColor: PAL[1] },
      { label: 'CSAT ' + cmpTxt, data: cs.map(o => o.anterior && o.anterior.csat.pct !== null ? o.anterior.csat.pct : null), backgroundColor: cssv('--line') }] },
      options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } }, tooltip: { callbacks: { label: c => c.dataset.label + ': ' + fmtN(c.parsed.y, 1) + '% (' + (c.datasetIndex === 0 ? cs[c.dataIndex].atual.csat.respostas : (cs[c.dataIndex].anterior ? cs[c.dataIndex].anterior.csat.respostas : 0)) + ' respostas)' } } },
        scales: { x: { grid: { display: false } }, y: { min: 0, max: 100, ticks: { callback: v => v + '%' } } } } });
  }
}


/* ===== Central de configurações (só quem administra) ===== */
function viewConfig(o){
  o = o || {};
  S.cfgAba = o.aba || S.cfgAba || 'indicadores';
  const abas = [['indicadores', 'Indicadores'], ['listas', 'Listas'], ['canais', 'Canais de atendimento'], ['geral', 'Geral'], ['equipe', 'Equipe e acessos']];
  $('#main').innerHTML = '<div class="page-head"><div><h1>Configurações</h1><p class="sub">Tudo o que antes era editado direto na planilha. Cada mudança fica registrada na Auditoria.</p></div></div>' +
    '<div class="tabs">' + abas.map(a => '<button class="chip" data-aba="' + a[0] + '" aria-pressed="' + (a[0] === S.cfgAba) + '">' + a[1] + '</button>').join('') + '</div><div id="cfgOut"><div class="loading">Carregando</div></div>';
  $$('[data-aba]').forEach(b => b.addEventListener('click', () => viewConfig({ aba: b.dataset.aba })));
  call('adminGet').then(r => { S.adm = r; renderConfig(); }).catch(e => { $('#cfgOut').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
}
function renderConfig(){
  ({ indicadores: cfgIndicadores, listas: cfgListas, canais: cfgCanais, geral: cfgGeral, equipe: cfgEquipe })[S.cfgAba]();
}
/** Depois de salvar: recarrega a Central e o que o app usa (catálogo, listas, equipe). */
function recarregarCfg(msg){
  if (msg) toast(msg);
  return Promise.all([call('adminGet'), call('bootstrap')]).then(([a, b]) => {
    S.adm = a; const prefs = S.boot.prefs; S.boot = b; S.boot.prefs = b.prefs || prefs;
    S.blocosLancar = b.blocos.filter(x => b.catalogo.some(c => c.bloco === x && !c.calculo));
    $('#dlg').open && $('#dlg').close(); renderConfig();
  }).catch(e => toast(e.message, true));
}
function dlgForm(titulo, corpo, botoes){
  const d = $('#dlg'); d.className = 'wide';
  d.innerHTML = '<div class="dlg-head"><h2 style="margin:0 0 12px">' + esc(titulo) + '</h2><button class="x" aria-label="Fechar">×</button></div>' + corpo +
    '<div class="actions" style="justify-content:flex-end;margin-top:16px">' + botoes + '</div>';
  $('.x', d).addEventListener('click', () => d.close());
  if (!d.open) d.showModal();
  return d;
}
const optList = (arr, sel) => arr.map(x => { const v = Array.isArray(x) ? x[0] : x, t = Array.isArray(x) ? x[1] : x; return '<option value="' + esc(v) + '"' + (String(v) === String(sel) ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('');
const numBr = v => vazio(v) ? '' : String(v).replace('.', ',');

function cfgIndicadores(){
  const A = S.adm, cat = A.catalogo;
  const blocos = []; cat.forEach(c => { if (blocos.indexOf(c.bloco) < 0) blocos.push(c.bloco); });
  const fb = S.cfgBloco || '', busca = (S.cfgBusca || '').toLowerCase(), inat = !!S.cfgInat;
  const lista = cat.filter(c => (!fb || c.bloco === fb) && (inat || c.ativo) && (!busca || (c.id + ' ' + c.indicador + ' ' + c.conta + ' ' + c.grupo).toLowerCase().indexOf(busca) >= 0));
  const faixaTxt = c => c.tipo === 'status' ? esc([c.atencao, c.critico].filter(Boolean).join(' / ') || '—') : (vazio(c.atencao) && vazio(c.critico) ? '—' : fmtV(c, c.meta) + ' · ' + fmtV(c, c.atencao) + ' · ' + fmtV(c, c.critico));
  $('#cfgOut').innerHTML = '<section class="panel"><div class="row" style="margin-bottom:12px">' +
    '<label class="f">Bloco<select id="ciBloco"><option value="">Todos</option>' + optList(blocos, fb) + '</select></label>' +
    '<label class="f" style="flex:1;min-width:180px">Buscar<input type="text" id="ciBusca" value="' + esc(S.cfgBusca || '') + '" placeholder="nome, ID, conta ou grupo"></label>' +
    '<label class="f" style="flex-direction:row;align-items:center;gap:8px;color:var(--ink)"><input type="checkbox" id="ciInat"' + (inat ? ' checked' : '') + '> Mostrar inativos</label>' +
    '<button class="btn primary" id="ciNovo">Novo indicador</button></div>' +
    '<div class="tbl-wrap"><table class="lista"><thead><tr><th>Indicador</th><th>Bloco · grupo</th><th>Tipo</th><th>Meta · atenção · crítico</th><th style="text-align:right">Lançamentos</th></tr></thead><tbody>' +
    lista.map(c => '<tr class="click' + (c.ativo ? '' : ' inativo') + '" data-ci="' + esc(c.id) + '"><td><b>' + esc(c.indicador) + '</b><span class="when">' + esc(c.id) + (c.ativo ? '' : ' · inativo') + (c.formula ? ' · fórmula' : '') + (c.calculo ? ' · calculado' : '') + '</span></td>' +
      '<td>' + esc(c.bloco) + '<span class="when">' + esc(rotGrupo(c)) + '</span></td><td>' + esc(c.tipo) + '<span class="when">melhor ' + esc(c.melhor_quando) + '</span></td>' +
      '<td>' + faixaTxt(c) + (c.versoes && c.versoes.length > 1 ? '<span class="when">' + (c.versoes.length - 1) + ' mudança(s) de meta</span>' : '') + '</td><td style="text-align:right">' + fmtN(c.lancamentos, 0) + '</td></tr>').join('') +
    '</tbody></table></div><p class="small muted">' + lista.length + ' indicador(es). Clique para editar.</p></section>';
  $('#ciBloco').addEventListener('change', e => { S.cfgBloco = e.target.value; cfgIndicadores(); });
  $('#ciBusca').addEventListener('change', e => { S.cfgBusca = e.target.value; cfgIndicadores(); });
  $('#ciInat').addEventListener('change', e => { S.cfgInat = e.target.checked; cfgIndicadores(); });
  $('#ciNovo').addEventListener('click', () => editarIndicador(null));
  $$('[data-ci]').forEach(tr => tr.addEventListener('click', () => editarIndicador(cat.find(c => c.id === tr.dataset.ci))));
}
function editarIndicador(c){
  const A = S.adm, novo = !c;
  c = c || { id: '', bloco: S.cfgBloco || '', conta: 'Geral', grupo: '', indicador: '', tipo: 'numero', melhor_quando: 'maior', meta: '', atencao: '', critico: '', agregacao: 'ultimo', frequencia: 'diaria', ordem: '', min: '', max: '', casas: '', opcoes: '', responsavel: '', descricao: '', formula: '', calculo: '', ativo: true, lancamentos: 0, versoes: [] };
  const blocos = [], contas = [], grupos = [];
  A.catalogo.forEach(x => { [[blocos, x.bloco], [contas, x.conta], [grupos, x.grupo]].forEach(([arr, v]) => { if (v && arr.indexOf(v) < 0) arr.push(v); }); });
  const pessoas = A.equipe.filter(e => e.ativa).map(e => e.nome);
  const ehStatus = c.tipo === 'status';
  const inp = (id, rot, v, extra) => '<label class="f">' + rot + '<input type="text" id="' + id + '" value="' + esc(v === null || v === undefined ? '' : v) + '"' + (extra || '') + '></label>';

  const botoes = (novo ? '' : (c.lancamentos ? '' : '<button class="btn" id="eDel" style="color:var(--crit)">Excluir</button>') +

  const coletar = () => ({ id: $('#eId', d).value.trim().toUpperCase(), indicador: $('#eNome', d).value, bloco: $('#eBloco', d).value, conta: $('#eConta', d).value, grupo: $('#eGrupo', d).value,
    responsavel: $('#eResp', d).value, tipo: $('#eTipo', d).value, melhor_quando: $('#eMelhor', d).value, opcoes: $('#eOpcoes', d).value,
    meta: $('#eMeta', d).value, atencao: $('#eAt', d).value, critico: $('#eCr', d).value, agregacao: $('#eAgr', d).value, frequencia: $('#eFreq', d).value,
    ordem: $('#eOrdem', d).value, min: $('#eMin', d).value, max: $('#eMax', d).value, casas: $('#eCasas', d).value,
    formula: $('#eFormula', d) ? $('#eFormula', d).value : '', descricao: $('#eDesc', d).value });
  const salvar = (confirmar) => {
    const b = $('#eSalvar', d); if (b) b.disabled = true;
    call('saveIndicador', { ind: coletar(), novo: novo, confirmar: !!confirmar }).then(r => {
      if (r.precisaConfirmar) {
        const dados = coletar();
        return confirmar_perigo(r.avisos, () => { editarIndicadorReabrir(c, dados, novo); });
      }
      recarregarCfg(r.acao === 'criado' ? 'Indicador criado.' : (r.metaVersionada ? 'Salvo. A meta nova vale a partir de hoje.' : 'Indicador salvo.'));
    }).catch(e => { if (b) b.disabled = false; toast(e.message, true); });
  };
  $('#eSalvar', d).addEventListener('click', () => salvar(false));
  if ($('#eAtivo', d)) $('#eAtivo', d).addEventListener('click', () => call('toggleIndicador', { id: c.id, ativo: !c.ativo }).then(() => recarregarCfg(c.ativo ? 'Indicador inativado. O histórico continua guardado.' : 'Indicador ativado.')).catch(e => toast(e.message, true)));
  if ($('#eDel', d)) $('#eDel', d).addEventListener('click', () => confirmar('Excluir indicador', '<p>O indicador <b>' + esc(c.indicador) + '</b> (' + esc(c.id) + ') não tem lançamentos e será excluído.</p>', 'Excluir',
    () => call('deleteIndicador', { id: c.id }).then(() => recarregarCfg('Indicador excluído.')).catch(e => toast(e.message, true))));
}
/** Mudança perigosa: mostra os avisos e, se confirmar, grava com confirmar=true. */
function confirmar_perigo(avisos, depois){
  S.cfgPendente = depois;
  confirmar('Mudança com impacto no histórico', '<ul>' + avisos.map(a => '<li>' + esc(a) + '</li>').join('') + '</ul><p>Quer seguir assim?</p>', 'Sim, salvar', () => depois());
}
function editarIndicadorReabrir(c, dados, novo){
  call('saveIndicador', { ind: dados, novo: novo, confirmar: true }).then(r => recarregarCfg(r.metaVersionada ? 'Salvo. A meta nova vale a partir de hoje.' : 'Indicador salvo.')).catch(e => toast(e.message, true));
}

    call('saveMembro', { membro: membro, original: novo ? '' : m.nome }).then(() => recarregarCfg('Pessoa salva.')).catch(e => toast(e.message, true));
  });
  if ($('#mReset', d)) $('#mReset', d).addEventListener('click', () => confirmar('Resetar senha', '<p>A senha de <b>' + esc(m.nome) + '</b> será apagada e ela sairá do app em todos os aparelhos. No próximo acesso, ela cria uma senha nova.</p>', 'Resetar',
    () => call('resetSenha', { nome: m.nome }).then(() => recarregarCfg('Senha resetada.')).catch(e => toast(e.message, true))));
  if ($('#mDel', d)) $('#mDel', d).addEventListener('click', () => confirmar('Excluir pessoa', '<p><b>' + esc(m.nome) + '</b> não tem nenhum registro e será excluída.</p>', 'Excluir',
    () => call('deleteMembro', { nome: m.nome }).then(() => recarregarCfg('Pessoa excluída.')).catch(e => toast(e.message, true))));
}

/* ===== Início ===== */
function loginExterno(msg){
  $$('.nav').forEach(b => { b.hidden = true; });
  $('#sheetLink').hidden = true; ['#btnSair', '#btnSenha'].forEach(id => { if ($(id)) $(id).remove(); }); $('#whoami').textContent = '';
  $('#main').innerHTML = '<div class="panel" style="max-width:440px;margin:40px auto"><h1 style="margin-bottom:8px">Entrar</h1>' +
    (msg ? '<p class="ruim small">' + esc(msg) + '</p>' : '<p class="sub" style="margin-bottom:14px">Use o seu e-mail da Cellfy (ou seu usuário) e a sua senha. No primeiro acesso, você cria a senha.</p>') +
    '<div class="filters" id="lgBox">' +
    '<label class="f">Endereço do sistema<input type="text" id="lgUrl" value="' + esc(lsGet('pw_url') || '') + '" placeholder="https://script.google.com/macros/s/.../exec"></label>' +
    '<label class="f">E-mail ou usuário<input type="text" id="lgUser" autocomplete="username" value="' + esc(lsGet('pw_login') || '') + '"></label>' +
    '<label class="f">Senha<input type="password" id="lgSenha" autocomplete="current-password"></label>' +
    '<button class="btn primary" id="lgBtn">Entrar</button></div>' +
    '<p class="small muted" style="margin:12px 0 0">O endereço do sistema só precisa ser colado uma vez neste computador. Esqueceu a senha? Peça à gestora para resetar.</p></div>';
  if (lsGet('pw_url')) setTimeout(() => (lsGet('pw_login') ? $('#lgSenha') : $('#lgUser')).focus(), 0);
  const guardarUrl = () => {
    const url = $('#lgUrl').value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) { toast('O endereço precisa começar com https://script.google.com e terminar em /exec.', true); return false; }
    lsSet('pw_url', url); API_URL = url; return true;
  };
  const entrar = () => {
    if (!guardarUrl()) return;
    const user = $('#lgUser').value.trim();
    if (!user) return toast('Digite o seu e-mail ou usuário.', true);
    const btn = $('#lgBtn'); btn.disabled = true; btn.textContent = 'Entrando';
    call('login', { usuario: user, senha: $('#lgSenha').value }).then(r => {
      lsSet('pw_login', user);
      if (r.primeiroAcesso) return criarSenha(user, r.nome);
      lsSet('pw_token', r.token); iniciar();
    }).catch(e => { btn.disabled = false; btn.textContent = 'Entrar'; toast(e.message, true); });
  };
  $('#lgBtn').addEventListener('click', entrar);
  ['#lgUser', '#lgSenha'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); }));
}
/** Primeiro acesso: a pessoa cria a própria senha. */
function criarSenha(user, nome){
  $('#lgBox').innerHTML = '<p style="margin:0">Olá, <b>' + esc(nome) + '</b>! Este é o seu primeiro acesso. Crie a sua senha (mínimo de 6 caracteres).</p>' +
    '<label class="f">Nova senha<input type="password" id="lgNova" autocomplete="new-password"></label>' +
    '<label class="f">Repita a senha<input type="password" id="lgNova2" autocomplete="new-password"></label>' +
    '<button class="btn primary" id="lgCriar">Criar senha e entrar</button>';
  $('#lgNova').focus();
  const criar = () => {
    const a = $('#lgNova').value, b = $('#lgNova2').value;
    if (a.length < 6) return toast('A senha precisa ter pelo menos 6 caracteres.', true);
    if (a !== b) return toast('As duas senhas não estão iguais.', true);
    const btn = $('#lgCriar'); btn.disabled = true;
    call('login', { usuario: user, novaSenha: a }).then(r => { lsSet('pw_token', r.token); toast('Senha criada. Bem-vinda!'); iniciar(); })
      .catch(e => { btn.disabled = false; toast(e.message, true); });
  };
  $('#lgCriar').addEventListener('click', criar);
  $('#lgNova2').addEventListener('keydown', e => { if (e.key === 'Enter') criar(); });
}
function trocarMinhaSenha(){
  const d = $('#dlg'); d.className = '';
  d.innerHTML = '<div class="dlg-head"><h2 style="margin:0 0 12px">Trocar minha senha</h2><button class="x" aria-label="Fechar">×</button></div><div class="filters">' +
    '<label class="f">Senha atual<input type="password" id="tsAtual" autocomplete="current-password"></label>' +
    '<label class="f">Nova senha<input type="password" id="tsNova" autocomplete="new-password"></label>' +
    '<label class="f">Repita a nova senha<input type="password" id="tsNova2" autocomplete="new-password"></label></div>' +
    '<div class="actions" style="justify-content:flex-end;margin-top:16px"><button class="btn primary" id="tsOk">Trocar senha</button></div>';
  $('.x', d).addEventListener('click', () => d.close());
  $('#tsOk', d).addEventListener('click', () => {
    if ($('#tsNova', d).value !== $('#tsNova2', d).value) return toast('As duas senhas novas não estão iguais.', true);
    call('trocarSenha', { atual: $('#tsAtual', d).value, nova: $('#tsNova', d).value }).then(() => { d.close(); toast('Senha trocada.'); }).catch(e => toast(e.message, true));
  });
  d.showModal();
}
function sair(){ lsSet('pw_token', ''); location.reload(); }
function iniciar(){
  const externo = !(window.google && google.script && google.script.run);
  if (externo && (!API_URL || !lsGet('pw_token'))) return loginExterno();
  call('bootstrap').then(r => {
    S.boot = r;
    $('#brand').textContent = r.cfg.nome_sistema; document.title = (r.cfg.nome_sistema ? r.cfg.nome_sistema + ' · ' : '') + 'Cellfy';
    $('#whoami').textContent = S.boot.usuario.nome;
    $('#sheetLink').href = r.planilhaUrl; $('#sheetLink').hidden = false;
    if (externo && !$('#btnSair')) {
      const mk = (id, txt, fn) => { const bt = document.createElement('button'); bt.id = id; bt.className = 'lnk small'; bt.style.color = '#B9C4CF'; bt.style.display = 'block'; bt.style.marginTop = '8px'; bt.textContent = txt; bt.addEventListener('click', fn); $('.rail-foot').appendChild(bt); };
      mk('btnSenha', 'Trocar minha senha', trocarMinhaSenha); mk('btnSair', 'Sair', sair);
    }
    const perfil = S.boot.usuario.perfil || 'visualizar';
    const visiveis = { completo: ['painel','analises','lancar','equipe','cancel','relatorio'], cancelamentos: ['cancel'], visualizar: ['painel','analises','relatorio'] }[perfil] || ['painel','analises','relatorio'];
    if (S.boot.usuario.admin) visiveis.push('config');
    $$('.nav').forEach(b => { b.hidden = visiveis.indexOf(b.dataset.view) < 0; });
    if (perfil !== 'completo' && !S.boot.usuario.admin) $('#sheetLink').hidden = true;
    S.blocosLancar = r.blocos.filter(b => r.catalogo.some(c => c.bloco === b && !c.calculo));
    go(visiveis[0]);
  }).catch(e => externo ? loginExterno(e.message) : ($('#main').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'));
}
iniciar();
</script>
